name: "Ozellik istegi"
description: "Yeni ozellik ya da iyilestirme onerisi"
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Once CONTRIBUTING.md ve docs/ROADMAP.md dosyalarini kontrol edin; oneri ekleyeceginiz is zaten planli olabilir."
  - type: textarea
    id: problem
    attributes:
      label: "Problem tanimi"
      description: "Hangi sikinti var, kim vuruluyor? mevcut durumu kisa ve net yazin."
      placeholder: "Ornek: yeni bir dosya biciminde analiz yapilamiyor"
    validations:
      required: true
  - type: textarea
    id: cozum
    attributes:
      label: "Onerilen cozum"
      description: "Nasil olmali? Beklenen davranisi, ciktiyi ya da arayuzu tarif edin."
      placeholder: "Ornek: rea_... araci capability_unsupported yerine gercek sonuc dondurur"
    validations:
      required: true
  - type: textarea
    id: alternatifler
    attributes:
      label: "Alternatifler"
      description: "Dusundugunuz baska yollar ve neden ikinci planda kaldi (istege bagli)."
      placeholder: "Ornek: CLI ile manuel cozum var ama otomasyon degil"
    validations:
      required: false
  - type: dropdown
    id: alan
    attributes:
      label: "Alan"
      description: "Onerinin dokundugu alan."
      options:
        - "arac"
        - "cli"
        - "docs"
        - "test"
        - "kurulum/dagitim"
        - "diger"
    validations:
      required: true
  - type: checkboxes
    id: kapsam
    attributes:
      label: "Kapsam"
      description: "Oneri asagidaki sinirlara uyuyor mu?"
      options:
        - label: "Conduit cekirdek 30 arac adina dokunmuyor (toolNamespace.ts dondurulmus)"
          required: true
        - label: "Uydurma sayi/arac/sisma iddiasi icermiyor; kanit kaynakla verilecek"
          required: true
