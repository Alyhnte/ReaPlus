name: "Good first issue"
description: "Propose a small, single-topic task for newcomers"
title: "[good-first] "
labels: ["good-first-issue"]
body:
  - type: markdown
    attributes:
      value: "This form is for small tasks suitable for newcomers. Read CONTRIBUTING.md before starting."
  - type: textarea
    id: task
    attributes:
      label: "Task description"
      description: "What needs to be done? One sentence, single topic."
      placeholder: "Example: README number-sync inconsistency"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "How do we know the work is done (command and expected result)?"
      placeholder: "Example: npm run typecheck and npm test are green"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "The area this task touches."
      options:
        - "docs"
        - "number-sync"
        - "corpus-provenance"
        - "test"
        - "small-bug"
        - "other"
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: "Related file or area"
      description: "Example: tests/corpus/README.md"
      placeholder: "path or area name"
    validations:
      required: false
  - type: checkboxes
    id: suitability
    attributes:
      label: "Newcomer suitability"
      description: "Could this really be a first PR?"
      options:
        - label: "PR-sized and single-topic"
          required: true
        - label: "Does not require live injection, a debugger, packet capture, or network downloads"
          required: true
        - label: "Does not add or change a conduit core tool name"
          required: true
